<!DOCTYPE html>
<html>
<head>
  <title>Spotify Redirect</title>
  <script type="text/javascript">
    window.onload = function() {
      const params = new URLSearchParams(window.location.search || window.location.hash.substring(1));
      const queryString = params.toString();

      // Check which app to redirect to based on 'state' parameter
      const state = params.get('state') || '';

      let redirectUri;
      if (state.startsWith('mixaroo_')) {
        // Redirect to Mixaroo web app
        redirectUri = 'https://mixaroo.vercel.app/api/spotify/callback' + (queryString ? '?' + queryString : '');
      } else {
        // Default: redirect to MusicTwin mobile app (original behavior)
        redirectUri = 'musictwin://profile' + (queryString ? '?' + queryString : '');
      }

      window.location.href = redirectUri;
    };
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
